<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Clone - Chat</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#25D366">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
</head>
<body class="chat-page">
    <!-- Header do Chat -->
    <header class="chat-header">
        <button id="backBtn" class="btn-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z" fill="white"/>
            </svg>
        </button>
        <div class="chat-info">
            <div class="avatar">👤</div>
            <div class="chat-details">
                <h3 id="chatTitle">Chat Privado</h3>
                <span id="chatStatus">online</span>
            </div>
        </div>
        <div class="header-actions">
            <button id="exportBtn" class="btn-icon" title="Exportar conversa">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                    <path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z" fill="white"/>
                </svg>
            </button>
            <button id="deleteBtn" class="btn-icon" title="Apagar chat">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                    <path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z" fill="white"/>
                </svg>
            </button>
            <button id="autoDestroyBtn" class="btn-icon" title="Autodestruição">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                    <path d="M11 17c0 .55.45 1 1 1s1-.45 1-1-.45-1-1-1-1 .45-1 1zm0-14v4h2V5.08c3.39.49 6 3.39 6 6.92 0 3.87-3.13 7-7 7s-7-3.13-7-7c0-1.68.59-3.22 1.58-4.42L12 13l1.41-1.41-6.8-6.8v.02C4.42 6.45 3 9.05 3 12c0 4.97 4.02 9 9 9 4.97 0 9-4.03 9-9s-4.03-9-9-9h-1zm7 9c0-.55-.45-1-1-1s-1 .45-1 1 .45 1 1 1 1-.45 1-1zM6 12c0 .55.45 1 1 1s1-.45 1-1-.45-1-1-1-1 .45-1 1z" fill="white"/>
                </svg>
            </button>
        </div>
    </header>

    <!-- Área de Mensagens -->
    <main class="chat-messages" id="messagesContainer">
        <div class="messages-list" id="messagesList"></div>
    </main>

    <!-- Input de Mensagens -->
    <footer class="chat-input">
        <div class="input-container">
            <input type="file" id="fileInput" accept="image/*,video/*,audio/*,.pdf,.doc,.docx" style="display: none;">
            <button id="attachBtn" class="btn-attach">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                    <path d="M16.5 6v11.5c0 2.21-1.79 4-4 4s-4-1.79-4-4V5c0-1.38 1.12-2.5 2.5-2.5s2.5 1.12 2.5 2.5v10.5c0 .55-.45 1-1 1s-1-.45-1-1V6H10v9.5c0 1.38 1.12 2.5 2.5 2.5s2.5-1.12 2.5-2.5V5c0-2.21-1.79-4-4-4S7 2.79 7 5v12.5c0 3.04 2.46 5.5 5.5 5.5s5.5-2.46 5.5-5.5V6h-1.5z" fill="#54656f"/>
                </svg>
            </button>
            <input type="text" id="messageInput" placeholder="Digite uma mensagem..." autocomplete="off">
            <button id="sendBtn" class="btn-send">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                    <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z" fill="white"/>
                </svg>
            </button>
        </div>
    </footer>

    <!-- Modal de Confirmação -->
    <div id="confirmModal" class="modal">
        <div class="modal-content">
            <h3>Confirmar Ação</h3>
            <p id="modalMessage"></p>
            <div class="modal-actions">
                <button id="modalCancel" class="btn-secondary">Cancelar</button>
                <button id="modalConfirm" class="btn-primary">Confirmar</button>
            </div>
        </div>
    </div>

    <!-- Modal de Autodestruição -->
    <div id="autoDestroyModal" class="modal">
        <div class="modal-content">
            <h3>Configurar Autodestruição</h3>
            <p>Defina o tempo em minutos para o chat se autodestruir:</p>
            <input type="number" id="destroyTime" min="1" max="1440" value="60" placeholder="Minutos">
            <div class="modal-actions">
                <button id="autoDestroyCancel" class="btn-secondary">Cancelar</button>
                <button id="autoDestroyConfirm" class="btn-primary">Ativar</button>
            </div>
        </div>
    </div>

    <script src="./app.js"></script>
</body>
</html>
