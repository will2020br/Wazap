<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Alternativas Grátis</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f0f2f5; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        
        .container { background: white; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); max-width: 500px; width: 100%; overflow: hidden; }
        
        .header { background: linear-gradient(135deg, #25D366, #128C7E); color: white; padding: 25px; text-align: center; }
        
        .header h1 { font-size: 24px; margin-bottom: 8px; }
        
        .header p { opacity: 0.9; font-size: 14px; }
        
        .setup-area { padding: 25px; background: #f8f9fa; }
        
        .option-card { background: white; border: 2px solid #e9ecef; border-radius: 10px; padding: 20px; margin: 15px 0; cursor: pointer; transition: all 0.3s; }
        
        .option-card:hover { border-color: #25D366; transform: translateY(-2px); }
        
        .option-card.active { border-color: #25D366; background: #f0f9f0; }
        
        .option-title { font-weight: 600; color: #495057; margin-bottom: 8px; }
        
        .option-description { font-size: 13px; color: #6c757d; }
        
        .option-price { font-size: 12px; color: #28a745; font-weight: 600; margin-top: 5px; }
        
        .input-group { margin-top: 15px; display: none; }
        
        .input-group label { display: block; margin-bottom: 5px; font-weight: 600; color: #495057; font-size: 14px; }
        
        .input-group input { width: 100%; padding: 12px 15px; border: 2px solid #e9ecef; border-radius: 8px; font-size: 14px; transition: border-color 0.3s; }
        
        .input-group input:focus { outline: none; border-color: #25D366; }
        
        .btn-primary { background: #25D366; color: white; border: none; padding: 12px 24px; border-radius: 25px; font-weight: 600; cursor: pointer; transition: all 0.3s; width: 100%; font-size: 16px; }
        
        .btn-primary:hover { background: #128C7E; transform: translateY(-2px); }
        
        .btn-primary:disabled { background: #6c757d; cursor: not-allowed; transform: none; }
        
        .status { padding: 12px; border-radius: 8px; text-align: center; font-size: 14px; font-weight: 500; margin: 15px 0; }
        
        .status.connected { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        
        .status.connecting { background: #cce5ff; color: #004085; border: 1px solid #b8daff; }
        
        .status.disconnected { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        
        .chat-area { display: none; height: 60vh; max-height: 500px; }
        
        .chat-messages { height: calc(100% - 80px); overflow-y: auto; padding: 20px; background: #e5ddd5; background-image: url('data:image/svg+xml,<svg width="100" height="100" xmlns="http://www.w3.org/2000/svg"><defs><pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse"><path d="M 50 0 L 0 0 0 50" fill="none" stroke="%23e5ddd5" stroke-width="0.5" opacity="0.3"/></pattern></defs><rect width="100" height="100" fill="%23e5ddd5"/><rect width="100" height="100" fill="url(%23grid)"/></svg>'); }
        
        .message { max-width: 70%; padding: 10px 15px; border-radius: 18px; margin-bottom: 12px; word-wrap: break-word; }
        
        .message.sent { background: #dcf8c6; margin-left: auto; border-bottom-right-radius: 4px; }
        
        .message.received { background: white; margin-right: auto; border-bottom-left-radius: 4px; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        
        .message-time { font-size: 10px; color: #6c757d; text-align: right; margin-top: 4px; }
        
        .chat-input { display: flex; gap: 10px; padding: 15px; background: #f8f9fa; border-top: 1px solid #dee2e6; }
        
        .chat-input input { flex: 1; padding: 12px 16px; border: 2px solid #e9ecef; border-radius: 25px; font-size: 14px; }
        
        .chat-input button { background: #25D366; color: white; border: none; width: 45px; height: 45px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.3s; }
        
        .chat-input button:hover { background: #128C7E; transform: scale(1.05); }
        
        .chat-input button:disabled { background: #6c757d; cursor: not-allowed; transform: none; }
        
        .copy-btn { background: #17a2b8; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; margin-left: 10px; }
        
        .copy-btn:hover { background: #138496; }
        
        .help-text { font-size: 12px; color: #6c757d; margin-top: 5px; }
        
        .code-example { background: #f8f9fa; border: 1px solid #e9ecef; border-radius: 4px; padding: 8px; font-family: monospace; font-size: 12px; word-break: break-all; margin: 5px 0; }
        
        @media (max-width: 576px) {
            .container { margin: 10px; border-radius: 10px; }
            .header, .setup-area { padding: 20px; }
            .chat-messages { padding: 15px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>💬 Chat Alternativas Grátis</h1>
            <p>TLS gratuito sem ngrok pago</p>
        </div>
        
        <div id="setupArea" class="setup-area">
            <h3 style="margin-bottom: 20px; color: #495057;">Escolha uma opção GRÁTIS:</h3>
            
            <!-- Botões com onclick direto -->
            <button class="option-card" onclick="selectCloudflare()" id="cloudflareBtn">
                <div class="option-title">🚀 Cloudflare Tunnel</div>
                <div class="option-description">TLS automático, gratuito, sem limites</div>
                <div class="option-price">✅ 100% GRATUITO</div>
            </button>
            
            <button class="option-card" onclick="selectLocaltunnel()" id="localtunnelBtn">
                <div class="option-title">⚡ Localtunnel</div>
                <div class="option-description">Simples, rápido, sem instalação</div>
                <div class="option-price">✅ 100% GRATUITO</div>
            </button>
            
            <button class="option-card" onclick="selectPinggy()" id="pinggyBtn">
                <div class="option-title">🎯 Pinggy</div>
                <div class="option-description">TCP/UDP com TLS gratuito</div>
                <div class="option-price">✅ Grátis</div>
            </button>
            
            <!-- Campos de entrada (inicialmente ocultos) -->
            <div id="cloudflareInput" class="input-group" style="display: none;">
                <label>URL do Cloudflare Tunnel:</label>
                <input type="text" id="cloudflareUrl" placeholder="https://seu-tunnel.cloudflare.com">
                <div class="help-text">Use: cloudflared tunnel --url localhost:8080</div>
            </div>
            
            <div id="localtunnelInput" class="input-group" style="display: none;">
                <label>URL do Localtunnel:</label>
                <input type="text" id="localtunnelUrl" placeholder="https://abcde.loca.lt">
                <div class="help-text">Use: npx localtunnel --port 8080</div>
            </div>
            
            <div id="pinggyInput" class="input-group" style="display: none;">
                <label>URL do Pinggy:</label>
                <input type="text" id="pinggyUrl" placeholder="wss://tcp.pinggy.io:12345">
                <div class="help-text">Use: ssh -p 443 -R0:localhost:8080 a.pinggy.io</div>
            </div>
            
            <div class="input-group">
                <label>Seu nome:</label>
                <input type="text" id="userName" placeholder="Seu nome" value="Usuário">
            </div>
            
            <div class="input-group">
                <label>Sala (compartilhe este nome):</label>
                <input type="text" id="roomName" placeholder="nome-da-sala" value="sala1">
            </div>
            
            <button id="connectBtn" class="btn-primary" onclick="handleConnection()" disabled>
                Conectar
            </button>
            
            <div id="status" class="status" style="display: none;"></div>
        </div>
        
        <div id="chatArea" class="chat-area">
            <div class="chat-messages" id="messagesList"></div>
            <div class="chat-input">
                <input type="text" id="messageInput" placeholder="Digite uma mensagem..." disabled>
                <button id="sendBtn" onclick="sendMessage()" disabled>
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="white">
                        <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <script>
        // Variáveis globais
        let selectedOption = '';
        let ws = null;
        let isConnected = false;
        let userName = '';
        let roomName = '';

        // FUNÇÕES SIMPLES (com onclick direto)
        function selectCloudflare() {
            console.log('🚀 Selecionado Cloudflare');
            selectedOption = 'cloudflare';
            
            // Limpa seleções anteriores
            document.querySelectorAll('.option-card').forEach(card => {
                card.classList.remove('active');
            });
            
            // Marca esta opção
            document.getElementById('cloudflareBtn').classList.add('active');
            
            // Mostra/oculta campos
            hideAllInputs();
            document.getElementById('cloudflareInput').style.display = 'block';
            document.getElementById('connectBtn').disabled = false;
        }

        function selectLocaltunnel() {
            console.log('⚡ Selecionado Localtunnel');
            selectedOption = 'localtunnel';
            
            document.querySelectorAll('.option-card').forEach(card => {
                card.classList.remove('active');
            });
            
            document.getElementById('localtunnelBtn').classList.add('active');
            hideAllInputs();
            document.getElementById('localtunnelInput').style.display = 'block';
            document.getElementById('connectBtn').disabled = false;
        }

        function selectPinggy() {
            console.log('🎯 Selecionado Pinggy');
            selectedOption = 'pinggy';
            
            document.querySelectorAll('.option-card').forEach(card => {
                card.classList.remove('active');
            });
            
            document.getElementById('pinggyBtn').classList.add('active');
            hideAllInputs();
            document.getElementById('pinggyInput').style.display = 'block';
            document.getElementById('connectBtn').disabled = false;
        }

        function hideAllInputs() {
            document.getElementById('cloudflareInput').style.display = 'none';
            document.getElementById('localtunnelInput').style.display = 'none';
            document.getElementById('pinggyInput').style.display = 'none';
        }

        function handleConnection() {
            console.log('🔌 Iniciando conexão...');
            
            if (!selectedOption) {
                alert('❌ Por favor, selecione uma opção primeiro!');
                return;
            }
            
            const urlField = selectedOption + 'Url';
            const url = document.getElementById(urlField).value.trim();
            
            if (!url) {
                alert('❌ Por favor, insira a URL!');
                return;
            }
            
            userName = document.getElementById('userName').value.trim() || 'Usuário';
            roomName = document.getElementById('roomName').value.trim() || 'sala1';
            
            console.log('📝 Dados:', { option: selectedOption, url: url, userName: userName, roomName: roomName });
            
            // Processa e conecta
            const processedUrl = processUrl(url);
            connectToServer(processedUrl);
        }

        function processUrl(url) {
            let processedUrl = url.trim();
            
            console.log('🔗 Processando URL:', processedUrl);
            
            // Converte baseado no serviço
            switch(selectedOption) {
                case 'cloudflare':
                case 'localtunnel':
                    // Converte HTTPS para WSS
                    processedUrl = processedUrl.replace('https://', 'wss://');
                    if (!processedUrl.startsWith('wss://')) {
                        processedUrl = 'wss://' + processedUrl;
                    }
                    break;
                    
                case 'pinggy':
                    // Converte TCP para WSS
                    processedUrl = processedUrl.replace('tcp://', 'wss://');
                    if (!processedUrl.startsWith('ws')) {
                        processedUrl = 'wss://' + processedUrl;
                    }
                    break;
            }
            
            console.log('🔗 URL final:', processedUrl);
            return processedUrl;
        }

        function connectToServer(url) {
            console.log('🔄 Conectando a:', url);
            updateStatus('Conectando...', 'connecting');
            document.getElementById('connectBtn').disabled = true;
            
            try {
                ws = new WebSocket(url);
                
                ws.onopen = function() {
                    console.log('✅ Conectado com sucesso!');
                    isConnected = true;
                    updateStatus('Conectado', 'connected');
                    showChat();
                    
                    // Entrar na sala
                    ws.send(JSON.stringify({
                        type: 'join',
                        room: roomName,
                        userName: userName
                    }));
                    
                    addMessage(`🎉 Você entrou na sala "${roomName}"`, 'sistema');
                };
                
                ws.onmessage = function(event) {
                    console.log('📨 Mensagem recebida:', event.data);
                    const msg = JSON.parse(event.data);
                    
                    if (msg.type === 'message') {
                        const sender = msg.userName === userName ? 'Você' : (msg.userName || 'Anônimo');
                        const messageType = msg.userName === userName ? 'sent' : 'received';
                        addMessage(`${sender}: ${msg.text}`, messageType);
                    }
                };
                
                ws.onclose = function() {
                    console.log('🔌 Desconectado');
                    isConnected = false;
                    updateStatus('Desconectado', 'disconnected');
                    document.getElementById('connectBtn').disabled = false;
                    addMessage('🔌 Conexão perdida. Verifique o serviço e tente novamente.', 'sistema');
                };
                
                ws.onerror = function(error) {
                    console.error('❌ Erro:', error);
                    updateStatus('Erro de conexão', 'disconnected');
                    document.getElementById('connectBtn').disabled = false;
                    alert('❌ Erro ao conectar!\n\nVerifique:\n1. O serviço está rodando?\n2. A URL está correta?\n3. Tente outro serviço da lista');
                };
                
            } catch (error) {
                console.error('❌ Erro ao conectar:', error);
                updateStatus('Erro ao conectar', 'disconnected');
                document.getElementById('connectBtn').disabled = false;
                alert('❌ Erro: ' + error.message);
            }
        }

        function sendMessage() {
            if (!isConnected || !ws || ws.readyState !== WebSocket.OPEN) {
                alert('❌ Não conectado!');
                return;
            }
            
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            
            if (!text) return;
            
            const message = {
                type: 'message',
                text: text,
                room: roomName,
                userName: userName,
                timestamp: new Date().toISOString()
            };
            
            ws.send(JSON.stringify(message));
            input.value = '';
        }

        function addMessage(text, type) {
            const messagesList = document.getElementById('messagesList');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}`;
            
            const time = new Date().toLocaleTimeString('pt-BR', { 
                hour: '2-digit', 
                minute: '2-digit' 
            });
            
            messageDiv.innerHTML = `
                <div>${text}</div>
                <div class="message-time">${time}</div>
            `;
            
            messagesList.appendChild(messageDiv);
            messagesList.scrollTop = messagesList.scrollHeight;
        }

        function showChat() {
            document.getElementById('setupArea').style.display = 'none';
            document.getElementById('chatArea').style.display = 'block';
            document.getElementById('messageInput').disabled = false;
            document.getElementById('sendBtn').disabled = false;
        }

        function updateStatus(text, type) {
            const status = document.getElementById('status');
            status.textContent = text;
            status.className = `status ${type}`;
            status.style.display = 'block';
        }

        // Inicialização
        document.addEventListener('DOMContentLoaded', () => {
            console.log('🚀 Chat alternativas - Botões funcionando!');
            console.log('📍 Funções disponíveis: selectCloudflare(), selectLocaltunnel(), selectPinggy(), handleConnection()');
            
            // Esconde todos os inputs no início
            hideAllInputs();
        });
    </script>
</body>
</html>
